spring.datasource.url=jdbc:mysql://localhost:3306/lt_music?serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis.typeAliasesPackage=com.example.yin.domain
mybatis.mapperLocations=classpath:mapper/*.xml
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8

spring.server.MaxFileSize=50MB
spring.server.MaxRequestSize=50MB
# 单个文件最大 50MB
server.tomcat.max-http-post-size=50MB


server.port=8888

#热部署生效
spring.devtools.restart.enabled=true

#设置重启的目录
spring.devtools.restart.additional-paths=src/main/java

#classpath目录下的WEB-INF文件夹内容修改不重启
spring.devtools.restart.exclude=WEB-INF/**

# AI配置
ai.openai.api-key=${AI_API_KEY}
ai.openai.base-url=${AI_BASE_URL:https://api.siliconflow.cn}
ai.openai.model=deepseek-ai/DeepSeek-V3

# Spring AI 配置
spring.ai.openai.api-key=${ai.openai.api-key}
spring.ai.openai.base-url=${ai.openai.base-url}
spring.ai.openai.model=${ai.openai.model}

# 禁用数据库初始化
spring.datasource.initialization-mode=never
